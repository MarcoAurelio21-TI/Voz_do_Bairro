<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Criar Conta - Voz do Bairro</title>
  <link rel="icon" type="image/x-icon" href="../img/logo.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/cadastro.css">
</head>
<body>
  <!-- Botão de Voltar ao Início -->
  <a href="../index.html" class="btn-voltar" title="Voltar ao início">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Início
  </a>

  <main class="container">
    <section class="card">
      <h1 class="titulo">Criar conta</h1>
      <p class="subtitulo">É rapidinho e gratuito.</p>

      <form class="formulario" action="#" method="POST">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>

        <div class="campo">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" name="confirmar-senha" required>
        </div>

        <button type="submit" class="btn-principal">Cadastrar</button>
      </form>

      <p class="rodape-link">
        Já tem conta? <a href="Login.html">Entrar!</a>
      </p>
    </section>
  </main>
</body>
</html>
