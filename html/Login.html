<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Acesso do Morador - Voz do Bairro</title>
  <link rel="icon" type="image/x-icon" href="../img/logo.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/Login.css">
</head>
<body>
  <!-- Botão de Voltar ao Início -->
  <a href="../index.html" class="btn-voltar" title="Voltar ao início">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Início
  </a>

  <main class="container">
    <div class="logo-area">
      <img src="../img/logo.png" alt="Logo Voz do Bairro" class="logo">
    </div>

    <section class="card">
      <h1 class="titulo">Acesso do Morador</h1>
      <p class="subtitulo">Acesse sua conta para continuar.</p>

      <form class="formulario" action="#" method="POST">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Exemplo@email.com" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="******" required>
        </div>

        <button type="submit" class="btn-principal">Entrar</button>
      </form>

      <p class="rodape-link">
        Ainda não tem conta? <a href="./cadastro.html">Cadastre-se!</a>
      </p>
    </section>

  </main>
</body>
</html>
